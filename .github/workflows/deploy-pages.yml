name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and inject weather config
        env:
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OPENWEATHERMAP_API_KEY" ]; then
            echo "::error::Add OPENWEATHERMAP_API_KEY as a repository Actions secret."
            exit 1
          fi
          mkdir _site
          git archive HEAD | tar -x -C _site
          node <<'NODE'
          const fs = require("node:fs");
          const key = process.env.OPENWEATHERMAP_API_KEY;
          fs.writeFileSync(
            "_site/chamber/scripts/weather-config.js",
            `window.OPENWEATHERMAP_API_KEY = ${JSON.stringify(key)};\n`,
            "utf8"
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
